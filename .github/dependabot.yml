# Dependabot — automatic dependency updates for security + freshness.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# To DISABLE: delete this file, or set the schedule.interval to "monthly".
# To revert to alerts-only (no auto-PRs): disable in repo Settings → Code security.

version: 2
updates:
  # Python dependencies (uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group minor + patch updates so we don't get 20 separate PRs.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
