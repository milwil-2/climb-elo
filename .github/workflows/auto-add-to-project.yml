name: Auto-add issues to Climbing ELO project

# Adds every new / reopened / transferred issue to the "Climbing ELO" GitHub
# Project (#1), unless the issue carries the `research` label — those belong
# in the separate "Research" project and are added there manually for now.
#
# Re-fires on label add/remove so that:
#   - An issue that gets the `research` label after opening is NOT re-added
#     (the action skips when the NOT filter matches).
#   - An issue that has its `research` label REMOVED gets added to Climbing
#     ELO on the next label event.
#
# Required secret: ADD_TO_PROJECT_PAT
#   A personal access token with `project` scope (classic) OR a fine-grained
#   token with Project read+write and Issues read on this repo. Required
#   because GITHUB_TOKEN cannot write to user-owned Projects.

on:
  issues:
    types: [opened, reopened, transferred, labeled, unlabeled]

jobs:
  add-to-project:
    name: Add to Climbing ELO project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/milwil-2/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: research
          label-operator: NOT
