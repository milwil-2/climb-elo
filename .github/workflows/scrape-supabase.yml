name: Scrape IFSC → Supabase

# Keeps the production Supabase DB fresh:
#   1. Pulls the upcoming-events calendar (so /predictions stays populated).
#   2. Pulls recent finished results for the current and previous season.
#   3. Runs the ELO backfill for each discipline (ratings get re-computed from
#      any new results — idempotent thanks to uq_rating_history_athlete_round_kind).
#   4. Refreshes the combined Boulder+Lead ratings.
#
# Schedule: daily at 04:00 UTC. World Cup events happen on weekends during the
# April-October season, and finish by ~16:00 UTC — Monday's 04:00 UTC run picks
# up Saturday/Sunday results. During the off-season the run is mostly a no-op
# (idempotent skips on existing rows). Use workflow_dispatch for ad-hoc refreshes
# during live event weekends.
#
# Required secret: DATABASE_URL — the Supabase **session pooler** URL
#   (aws-0-REGION.pooler.supabase.com:5432). The direct URL is IPv6-only and
#   unreachable from GH Actions runners. The transaction pooler (port 6543) is
#   for serverless (Vercel) and doesn't support bulk ops / session state.
#   Use the "Session pooler" tab in Supabase → Settings → Database.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      historical_backfill:
        description: "Also run the full 2012→present historical scrape (slow)"
        type: boolean
        default: false
      # NOTE: there is intentionally NO force_reset input here. A full
      # wipe+recompute exceeds this job's 60-min timeout (the Lead rebuild
      # alone runs >60 min), which leaves prod HALF-REBUILT and broken —
      # this actually happened on 2026-05-28 (run 26550405752 was cancelled
      # mid-Lead-rebuild, stranding 778 athletes at default ratings). The
      # `--force-reset` flag on run_backfill.py is therefore a LOCAL-ONLY
      # operation: run it from a laptop pointed at the session pooler, where
      # there's no timeout. See issue #75 and CLAUDE.md.

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Fail fast if DATABASE_URL is missing
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it to repo secrets (direct Supabase connection, port 5432)."
            exit 1
          fi

      # ----------------------------------------------------------------------
      - name: Scrape upcoming events (all disciplines)
        run: uv run python scripts/scrape_upcoming.py --all-disciplines

      # ----------------------------------------------------------------------
      - name: Provision forecast tables (idempotent — first deploy only does work)
        run: uv run python scripts/init_forecast_tables.py

      # ----------------------------------------------------------------------
      - name: Migrate forecast unique constraint to include engine_version (#124, idempotent)
        run: uv run python scripts/migrate_forecast_engine_version_constraint.py

      # ----------------------------------------------------------------------
      - name: Migrate forecast-score unique constraint to include engine_version (#131, idempotent)
        run: uv run python scripts/migrate_forecast_score_engine_version_constraint.py

      # ----------------------------------------------------------------------
      - name: Snapshot forecasts for upcoming events
        run: uv run python scripts/snapshot_forecasts.py --within-days 7

      # ----------------------------------------------------------------------
      - name: Scrape recent IFSC results (all disciplines, current + previous season)
        run: |
          CURRENT_YEAR=$(date +%Y)
          PREV_YEAR=$((CURRENT_YEAR - 1))
          for discipline in lead boulder speed; do
            echo "::group::Scrape — $discipline"
            uv run python scripts/scrape_ifsc.py \
              --discipline "$discipline" \
              --min-year "$PREV_YEAR" \
              --max-year "$CURRENT_YEAR"
            echo "::endgroup::"
          done

      # ----------------------------------------------------------------------
      - name: Historical backfill (manual trigger only)
        if: ${{ inputs.historical_backfill == true }}
        run: uv run python scripts/scrape_ifsc_historical.py --min-year 2012

      # ----------------------------------------------------------------------
      # The backfill here is always idempotent — rounds with an existing pair
      # RatingHistory row are silently skipped, so this step only computes
      # ratings for newly-scraped rounds. This is correct for routine daily
      # operation.
      #
      # To ACTIVATE an engine change (K-regrid, σ-formula bump, etc.) the whole
      # history must be wiped + recomputed, but that exceeds this job's 60-min
      # timeout and is therefore a LOCAL-ONLY operation — do NOT add a
      # --force-reset path here. Run it from a laptop instead:
      #   export DATABASE_URL='<session pooler, port 5432>'
      #   for d in lead boulder speed; do
      #     uv run python scripts/run_backfill.py --discipline "$d" --force-reset
      #   done
      #   uv run python scripts/compute_combined_ratings.py
      - name: Run backfill for each discipline
        run: |
          for discipline in lead boulder speed; do
            echo "::group::Backfill — $discipline"
            uv run python scripts/run_backfill.py --discipline "$discipline"
            echo "::endgroup::"
          done

      - name: Compute combined Boulder+Lead ratings
        run: uv run python scripts/compute_combined_ratings.py

      # ----------------------------------------------------------------------
      - name: Score finished forecasts
        run: uv run python scripts/score_forecasts.py --all-unscored

      # ----------------------------------------------------------------------
      # Issue #118: real failing guard over the freshly-computed data + ratings.
      # Fails the job on recoverable parse failures (#115 class), σ-collapse
      # (#95), or μ-p95 drifting out of the calibrated band. Known-deferred
      # states (e.g. #117 scale drift) surface as non-failing warnings.
      - name: Data + rating health guard
        run: uv run python scripts/health_data_guard.py

      # ----------------------------------------------------------------------
      # Issue #93: incrementally enrich any newly-discovered athletes with their
      # IFSC photo + body metrics. --only-missing makes this cheap in steady
      # state (skips rows whose photo_url is already set). The one-time backfill
      # for the full ~2,700-athlete population is run locally by Milan — see
      # the "One-time setup" section in CLAUDE.md.
      - name: Enrich athlete profiles (photos, body metrics)
        run: uv run python scripts/scrape_athlete_profiles.py --only-missing

      # ----------------------------------------------------------------------
      - name: Show DB counts
        run: uv run python scripts/validate_db_counts.py
