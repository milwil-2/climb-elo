[project]
name = "climbing-elo"
version = "0.1.0"
description = "ELO rating system for World Climbing (formerly IFSC) Lead competitions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.48.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "python-multipart>=0.0.30",
    "slowapi>=0.1.9",
    "psycopg2-binary>=2.9",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `@pytest.mark.network` reach out to live external sites
# (Wikipedia for the IFSC ranking surface, ascentstats.com). They are
# skipped by default so CI never depends on third-party uptime. Run them
# locally with `uv run pytest -m network` when validating a scraper change.
markers = [
    "network: live external-network tests (skipped by default; run with -m network).",
]
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]
