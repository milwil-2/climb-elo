<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Climbing ELO{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            line-height: 1.6;
        }
        nav {
            background: #1a1d28;
            border-bottom: 1px solid #2a2d3a;
            padding: 1rem 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        nav .brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: #7c8aff;
            text-decoration: none;
        }
        nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.9rem;
        }
        nav a:hover { color: #fff; }
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        h1 { font-size: 1.6rem; margin-bottom: 1rem; color: #fff; }
        h2 { font-size: 1.2rem; margin: 1.5rem 0 0.75rem; color: #c0c0c0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        th, td {
            padding: 0.6rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid #1e2130;
        }
        th {
            background: #1a1d28;
            color: #808890;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr:hover { background: #1a1d28; }
        td a { color: #7c8aff; text-decoration: none; }
        td a:hover { text-decoration: underline; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-provisional {
            background: #3b2f00;
            color: #fbbf24;
        }
        .card {
            background: #1a1d28;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1rem 0;
        }
        .stats-row {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #fff; }
        .stat-label { font-size: 0.8rem; color: #808890; text-transform: uppercase; }
        .chart-container {
            position: relative;
            height: 300px;
            margin: 1rem 0;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/" class="brand">Climbing ELO</a>
        <a href="/">Leaderboard</a>
        <a href="/events">Events</a>
        <a href="/projections/new">Projections</a>
        <a href="/predictions">Predictions</a>
        {# TODO(#22): Only show when there is an active live event. For now hardcoded
           visible — live-event detection logic not yet built. #}
        <a href="/live" style="color:#4ade80">Live</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
